name: logpulse

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      LOGPULSE_STREAM: logpulse:events
      LOGPULSE_GROUP: logpulse-workers
      SLOW_THRESHOLD_MS: "500"
    # HTTP-порт открывается только на loopback хостовой машины.
    # Хост-порт настраивается переменной API_PORT (по умолчанию 8000).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      LOGPULSE_STREAM: logpulse:events
      LOGPULSE_GROUP: logpulse-workers
      SLOW_THRESHOLD_MS: "500"
    command: ["python", "worker.py"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
